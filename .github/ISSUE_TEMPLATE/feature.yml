name: Feature
description: Propose a sub-feature to build
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        KeepCV delivers features **complete**, one sub-feature at a time.
        A sub-feature is either not started or done — there is no partial state
        on `main`.

  - type: input
    id: capability
    attributes:
      label: Capability
      description: Which capability and sub-feature is this? e.g. "F4.3"
      placeholder: F4.3
    validations:
      required: true

  - type: textarea
    id: pain
    attributes:
      label: Which felt pain does this trace to?
      description: >
        Not a hypothetical user, not a competitor's feature list, not "the
        market expects it" — a pain someone has actually felt. A feature that
        cannot answer this is closed.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: What this includes
      description: The complete behaviour, including error and empty states.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Declared non-goals
      description: >
        What this deliberately does *not* do. This is where scope pressure gets
        absorbed: a good idea arriving mid-build becomes a new issue, not a
        bigger current one.
    validations:
      required: true

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Complete
      options:
        - label: Schema and migration, expand/contract compliant
        - label: API routes with validation and typed errors
        - label: UI covers create, read, update, archive, restore — no dead ends
        - label: Validation, error, loading and empty states
        - label: Survives the export/import round-trip test
        - label: Unit and integration tests, plus one end-to-end path
        - label: Accessibility pass — keyboard and screen reader
        - label: Docs updated; ADR added if an architectural choice was made
        - label: No TODOs, no feature flags left enabled
        - label: Changeset added
