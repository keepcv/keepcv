name: Feature
description: Propose something to build
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Work lands **complete**: either it delivers behaviour someone can use
        end to end, or it does not merge. Size this by what makes a whole
        behaviour, which may be one piece of a capability or several.

  - type: input
    id: area
    attributes:
      label: What does this touch?
      description: >
        A capability from `docs/architecture/capabilities.md`, a package, a
        screen, or whatever names it best. Free text.
      placeholder: Phrasing editor, or packages/core, or the resume composer
    validations:
      required: true

  - type: textarea
    id: pain
    attributes:
      label: Which felt pain does this trace to?
      description: >
        Not a hypothetical user, not a competitor's feature list, not "the
        market expects it" - a pain someone has actually felt. A feature that
        cannot answer this is closed.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: What this includes
      description: The complete behaviour, including error and empty states.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Declared non-goals
      description: >
        What this deliberately does *not* do. This is where scope pressure gets
        absorbed: a good idea arriving mid-build becomes a new issue, not a
        bigger current one.
    validations:
      required: true

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Complete
      description: >
        Tick what applies. Rows that genuinely do not apply to this work are
        better deleted than left unticked.
      options:
        - label: Schema and migration, expand/contract compliant
        - label: API routes with validation and typed errors
        - label: UI covers create, read, update, archive, restore - no dead ends
        - label: Validation, error, loading and empty states
        - label: Survives the export/import round-trip test
        - label: Unit and integration tests, plus one end-to-end path
        - label: Accessibility pass - keyboard and screen reader
        - label: Docs updated; an architecture decision recorded if one was made
        - label: No TODOs, no feature flags left enabled
