name: Set up workspace
description: Install the pinned Node and pnpm workspace dependencies
inputs:
  cache:
    description: Optional setup-node package-manager cache
    default: ''
runs:
  using: composite
  steps:
    - name: Enable pnpm
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        package-manager-cache: false
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
