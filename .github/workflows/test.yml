name: Test

on: pull_request

# A newer push to the same pull request makes the running job irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The repository contract suite runs against every implementation of the
    # port. PGlite is real Postgres in WASM and needs nothing, but it is not the
    # build a server runs, so the same suite runs against a server PostgreSQL
    # here as well.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keepcv
          POSTGRES_DB: keepcv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps rather than `pnpm check`, so a failure names itself in
      # the job summary. Ordered cheapest first.
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (type-aware)
        run: pnpm lint:types

      # A Drizzle schema edited without regenerating leaves the migrations
      # describing a database nobody has. `generate` writes nothing when the two
      # already agree.
      - name: Check migrations match the schema
        run: |
          pnpm --filter @keepcv/db db:generate
          test -z "$(git status --porcelain packages/db/migrations)" ||
            { git status --porcelain packages/db/migrations; exit 1; }

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:keepcv@localhost:5432/keepcv
