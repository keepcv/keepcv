name: Test

on:
  pull_request:
  workflow_call:
    outputs:
      release-version:
        description: Launcher version verified against the selected release branch
        value: ${{ jobs.test.outputs.release-version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}

      - name: Check the change is described
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

      - name: Check the prepared release
        id: release
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { releaseVersion } from './scripts/release-branch.mjs';
          const launcher = JSON.parse(readFileSync('apps/cli/package.json', 'utf8'));
          const version = releaseVersion(process.env.GITHUB_REF, launcher.version);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
          pnpm changeset status --output release-plan.json
          node -e 'if (require("./release-plan.json").releases.length) throw new Error("Version pending changesets before releasing")'
          rm release-plan.json

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (type-aware)
        run: pnpm lint:types

      - name: Check migrations match the schema
        run: |
          pnpm --filter @keepcv/db db:generate
          test -z "$(git status --porcelain packages/db/migrations)" ||
            { git status --porcelain packages/db/migrations; exit 1; }

      - name: Test release guards
        run: pnpm test:release

  databases:
    name: PostgreSQL and PGlite tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keepcv
          POSTGRES_DB: keepcv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}

      - name: Build database dependencies
        run: pnpm --filter @keepcv/db... build
      - name: Test both database drivers
        run: pnpm --filter @keepcv/db test --maxWorkers=2
        env:
          DATABASE_URL: postgres://postgres:keepcv@localhost:5432/keepcv

  applications:
    name: Application tests and release packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keepcv
          POSTGRES_DB: keepcv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}

      - name: Test remaining packages
        run: pnpm exec turbo run test --filter='!@keepcv/db' --concurrency=2
        env:
          DATABASE_URL: postgres://postgres:keepcv@localhost:5432/keepcv

      - name: Check release packages
        run: pnpm release:check
        env:
          DATABASE_URL: postgres://postgres:keepcv@localhost:5432/keepcv
          REUSE_PUBLISHED_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Save verified release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: .keepcv-release-check/packages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test:
    name: Lint, typecheck and test
    if: always()
    needs: [checks, databases, applications]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-version: ${{ needs.checks.outputs.release-version }}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [ "$RESULTS" != 'success,success,success' ]; then
            echo "Validation jobs did not all succeed: $RESULTS" >&2
            exit 1
          fi
