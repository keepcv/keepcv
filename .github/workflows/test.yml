name: Test

on:
  pull_request:
  workflow_call:
    outputs:
      release-version:
        description: Launcher version verified against the selected release branch
        value: ${{ jobs.test.outputs.release-version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-version: ${{ steps.release.outputs.version }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keepcv
          POSTGRES_DB: keepcv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the change is described
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

      - name: Check the prepared release
        id: release
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { releaseVersion } from './scripts/release-branch.mjs';
          const launcher = JSON.parse(readFileSync('apps/cli/package.json', 'utf8'));
          const version = releaseVersion(process.env.GITHUB_REF, launcher.version);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
          pnpm changeset status --output release-plan.json
          node -e 'if (require("./release-plan.json").releases.length) throw new Error("Version pending changesets before releasing")'
          rm release-plan.json

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (type-aware)
        run: pnpm lint:types

      - name: Check migrations match the schema
        run: |
          pnpm --filter @keepcv/db db:generate
          test -z "$(git status --porcelain packages/db/migrations)" ||
            { git status --porcelain packages/db/migrations; exit 1; }

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:keepcv@localhost:5432/keepcv

      - name: Check release packages
        run: pnpm release:check

      - name: Test release guards
        run: pnpm test:release

      - name: Save verified release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: .keepcv-release-check/packages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
