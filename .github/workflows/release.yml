name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared launcher version on main (for example 0.1.0)
        required: true
        type: string
      mode:
        description: Verify artifacts, publish with OIDC, or bootstrap new npm packages
        required: true
        default: verify
        type: choice
        options:
          - verify
          - trusted
          - bootstrap

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'keepcv/keepcv' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    with:
      release-version: ${{ inputs.version }}

  publish:
    needs: validate
    if: inputs.mode != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Publish verified tarballs
        working-directory: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
          NODE_AUTH_TOKEN: ${{ inputs.mode == 'bootstrap' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: |
          if [ "$RELEASE_MODE" = bootstrap ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Set NPM_BOOTSTRAP_TOKEN in the npm environment before bootstrapping.' >&2
            exit 1
          fi
          node release-artifacts.mjs publish

  announce:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Tag packages and create the GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node release-artifacts.mjs github
