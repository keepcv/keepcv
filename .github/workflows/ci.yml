name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running job irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Formatting and the bulk of linting. Fast, so it fails first.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The type-aware pass. Slower, and depends on built declarations.
      - name: Lint (type-aware)
        run: pnpm lint:types

      - name: Test
        run: pnpm test

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Every change to a published package needs a changeset, so releases are
      # never assembled by hand.
      - name: Check for a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
